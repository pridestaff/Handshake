<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate Dashboard | Northstar Talent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body data-page="profile" class="admin-body">
    <header class="site-header" style="background: white; border-bottom: 1px solid var(--line);">
      <a class="brand" href="index.html"><span class="brand-mark">N</span>Northstar <em>Talent</em></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="jobs.html">Browse Jobs</a>
        <a href="profile.html" style="opacity: 1; border-color: var(--peach);">My Dashboard</a>
        <button class="nav-sign-in is-signed-in" type="button" data-profile-sign-out>Sign out</button>
      </nav>
    </header>

    <main class="admin-main">
      <div class="admin-intro">
        <div>
          <p class="eyebrow">Candidate Portal</p>
          <h1 data-profile-name>My Dashboard</h1>
          <p style="color: var(--muted); margin: 0;" data-profile-email></p>
        </div>
        <div class="admin-actions">
          <a class="button button-primary" href="jobs.html">Search Jobs <span>→</span></a>
        </div>
      </div>

      <div class="admin-grid" style="grid-template-columns: 1.1fr 0.9fr;">
        <!-- Left: Application Status Tracker & Saved Jobs -->
        <div>
          <div class="admin-card">
            <h2>My Applications <span data-candidate-apps-count></span></h2>
            <div class="application-list" data-candidate-applications>
              <p class="empty-admin">Loading your applications...</p>
            </div>
          </div>

          <div class="admin-card" style="margin-top: 24px;">
            <h2>Saved Roles <span data-candidate-saved-count></span></h2>
            <div class="application-list" data-candidate-saved>
              <p class="empty-admin">No saved roles yet.</p>
            </div>
          </div>
        </div>

        <!-- Right: Candidate Profile Details -->
        <div>
          <div class="admin-card">
            <h2>Profile Details</h2>
            <form class="contact-form" style="padding: 0;" data-profile-form>
              <label>Full Name<input required name="full_name" /></label>
              <label>Phone Number<input required name="phone" /></label>
              <label>Key Skills (comma separated)<input name="skills" placeholder="e.g. Figma, React, Financial Analysis" /></label>
              <label>Experience Summary<textarea name="experience" rows="3" placeholder="Brief summary of your background"></textarea></label>
              <div class="form-two">
                <label>Preferred Location<input name="preferred_location" placeholder="e.g. Remote / London" /></label>
                <label>Salary Expectation<input name="salary_expectations" placeholder="e.g. $80k - $95k" /></label>
              </div>
              <label>Work Authorization<input name="work_authorization" placeholder="e.g. Citizen, Green Card, Work Visa" /></label>
              <label>Update CV <span class="small-label">PDF / DOC</span><input type="file" name="resume_file" accept=".pdf,.doc,.docx" /></label>
              <div id="current-cv-link" style="margin-top: -8px; font-size: 13px;"></div>
              <button class="button button-primary" type="submit">Save Profile <span>→</span></button>
              <p class="form-message" role="status"></p>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
